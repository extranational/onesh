[project]
name = "onesh"
version = "0.1.0"
description = "Ask a quick question, get a one-shot answer at the terminal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.scripts]
onesh = "onesh.cli:run"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
